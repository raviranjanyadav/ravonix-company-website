<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Multi-color premium gradient -->
    <linearGradient id="multiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="20%" stop-color="#FF7B00"/>
      <stop offset="40%" stop-color="#00FF7B"/>
      <stop offset="70%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#7B00FF"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background -->

  <!-- Main Text -->
  <text x="50%" y="45%" text-anchor="middle"
        font-family="Orbitron, sans-serif"
        font-size="110"
        font-weight="900"
        fill="url(#multiGrad)"
        filter="url(#glow)"
        letter-spacing="4">
    RAVONIX
  </text>

  <!-- Technologies Text (premium multi-color) -->
  <text x="50%" y="72%" text-anchor="middle"
        font-family="Montserrat, sans-serif"
        font-size="38"
        font-weight="800"
        fill="url(#multiGrad)"
        filter="url(#glow)"
        letter-spacing="14">
    TECHNOLOGIES
  </text>

  <!-- Premium swoosh -->
  <path d="M150 220 C350 100, 600 100, 800 220" stroke="url(#multiGrad)" stroke-width="6" fill="none" opacity="0.9"/>
  <path d="M150 220 C350 120, 600 120, 800 220" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>
</svg>
