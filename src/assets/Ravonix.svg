<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>

    <linearGradient id="primaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="brightBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <g transform="translate(60, 65)">
    <g transform="translate(145, 120)" opacity="0.7">
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#globeGrad)" stroke-width="3.5" />
      <ellipse cx="0" cy="0" rx="48" ry="75" fill="none" stroke="url(#globeGrad)" stroke-width="2.5" />
      <ellipse cx="0" cy="0" rx="22" ry="75" fill="none" stroke="url(#globeGrad)" stroke-width="2" />
      <line x1="0" y1="-75" x2="0" y2="75" stroke="url(#globeGrad)" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="75" ry="45" fill="none" stroke="url(#globeGrad)" stroke-width="2.5" />
      <ellipse cx="0" cy="0" rx="75" ry="20" fill="none" stroke="url(#globeGrad)" stroke-width="2" />
      <line x1="-75" y1="0" x2="75" y2="0" stroke="url(#globeGrad)" stroke-width="2" />
    </g>

    <g filter="url(#subtleShadow)">
      <path d="M 50,225 C 50,150 70,110 115,100 C 160,90 190,115 190,150 C 190,185 160,205 115,205 L 50,205 L 50,225 Z" fill="url(#primaryBlue)" />
      <path d="M 50,105 C 50,105 100,75 160,85 C 220,95 240,150 215,195 C 195,230 150,240 115,240 L 80,240 C 80,240 95,215 110,215 C 145,215 180,205 190,175 C 205,135 180,115 130,110 C 90,105 50,118 50,118 Z" fill="url(#brightBlue)" />
      <path d="M 50,185 C 50,185 55,245 95,260 L 165,260 L 185,280 L 115,280 C 75,280 50,245 50,185 Z" fill="url(#primaryBlue)" />
      <path d="M 100,280 L 250,100 L 230,85 L 290,75 L 285,135 L 265,118 L 125,280 Z" fill="url(#arrowGrad)" />
      <path d="M 125,280 L 265,118 L 250,100 Z" fill="#ffffff" opacity="0.15" />
    </g>

    <g transform="translate(360, 165)" filter="url(#subtleShadow)">
      <text x="0" y="0" font-family="System-UI, -apple-system, sans-serif" font-size="94" font-weight="800" fill="#FFFFFF" letter-spacing="1">RAVONIX</text>
      <text x="5" y="62" font-family="System-UI, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#E2E8F0" letter-spacing="14.5" opacity="0.95">TECHNOLOGIES</text>
    </g>
  </g>
</svg>
